<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intermediate Web Development Task</title>
  <style>
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f7f6;
      color: #333;
      line-height: 1.6;
    }

    
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #0d5c46;
      color: #fff;
      padding: 1rem 2rem;
    }

    .navbar .logo {
      font-size: 1.4rem;
      font-weight: bold;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 1.5rem;
    }

    .nav-links a {
      color: #fff;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .nav-links a:hover {
      opacity: 0.8;
    }

   
    .container {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
      display: grid;
      grid-template-columns: 1fr 1fr; /* Two equal columns */
      gap: 2rem;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .card h2 {
      color: #0d5c46;
      margin-bottom: 1rem;
      border-bottom: 2px solid #e0e0e0;
      padding-bottom: 0.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.3rem;
      font-weight: 600;
    }

    .form-group input, 
    .form-group textarea {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.95rem;
    }

    .form-group input:focus, 
    .form-group textarea:focus {
      outline: none;
      border-color: #0d5c46;
    }

    .error-msg {
      color: #d9534f;
      font-size: 0.85rem;
      margin-top: 0.2rem;
      display: none;
    }

    button.btn {
      background-color: #0d5c46;
      color: white;
      border: none;
      padding: 0.7rem 1.2rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      width: 100%;
      transition: background 0.2s;
    }

    button.btn:hover {
      background-color: #0a4736;
    }

    .success-msg {
      color: #2e7d32;
      margin-top: 1rem;
      display: none;
      font-weight: bold;
      text-align: center;
    }

   
    .todo-input-group {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .todo-input-group input {
      flex: 1;
      padding: 0.6rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .todo-input-group button {
      width: auto;
    }

    ul.todo-list {
      list-style: none;
    }

    ul.todo-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f9f9f9;
      padding: 0.6rem 0.8rem;
      border: 1px solid #eee;
      border-radius: 4px;
      margin-bottom: 0.5rem;
    }

    .delete-btn {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .delete-btn:hover {
      background: #c0392b;
    }

    
    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr; /* Switch to 1 column on mobile/tablet */
      }

      .navbar {
        flex-direction: column;
        gap: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">  Sumbition Form</div>
    <ul class="nav-links">
      <li><a href="#contact">Contact Form</a></li>
      <li><a href="#todo">To-Do App</a></li>
    </ul>
  </nav>

  <!-- CSS Grid Layout -->
  <main class="container">
    
    <!-- Task 1 & 2: Contact Form + Validation -->
    <section class="card" id="contact">
      <h2>Contact Us</h2>
      <form id="contactForm" novalidate>
        
        <div class="form-group">
          <label for="name">Full Name *</label>
          <input type="text" id="name" placeholder="Enter your full name">
          <div class="error-msg" id="nameError">Name is required.</div>
        </div>

        <div class="form-group">
          <label for="email">Email Address *</label>
          <input type="email" id="email" placeholder="example@domain.com">
          <div class="error-msg" id="emailError">Please enter a valid email.</div>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="4" placeholder="Your message here..."></textarea>
        </div>

        <button type="submit" class="btn">Send Message</button>
        <p class="success-msg" id="successMsg">Message sent successfully!</p>
      </form>
    </section>

    <!-- Task 4: Dynamic To-Do List -->
    <section class="card" id="todo">
      <h2>Dynamic To-Do List</h2>
      <div class="todo-input-group">
        <input type="text" id="todoInput" placeholder="Add a new task...">
        <button type="button" class="btn" id="addTodoBtn">Add Task</button>
      </div>
      <ul class="todo-list" id="todoList">
        <!-- Tasks will be dynamically added here -->
      </ul>
    </section>

  </main>

  <script>

    const contactForm = document.getElementById('contactForm');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const nameError = document.getElementById('nameError');
    const emailError = document.getElementById('emailError');
    const successMsg = document.getElementById('successMsg');

    contactForm.addEventListener('submit', function(event) {
      event.preventDefault();
      
      let isValid = true;
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      
      if (nameInput.value.trim() === '') {
        nameError.style.display = 'block';
        isValid = false;
      } else {
        nameError.style.display = 'none';
      }

      if (!emailRegex.test(emailInput.value.trim())) {
        emailError.style.display = 'block';
        isValid = false;
      } else {
        emailError.style.display = 'none';
      }

      
      if (isValid) {
        successMsg.style.display = 'block';
        contactForm.reset();
        setTimeout(() => {
          successMsg.style.display = 'none';
        }, 4000);
      }
    });

    
    const todoInput = document.getElementById('todoInput');
    const addTodoBtn = document.getElementById('addTodoBtn');
    const todoList = document.getElementById('todoList');

    function addTask() {
      const taskText = todoInput.value.trim();
      
      if (taskText === '') return;

    
      const li = document.createElement('li');
      
      
      const textSpan = document.createElement('span');
      textSpan.textContent = taskText;

      
      const deleteBtn = document.createElement('button');
      deleteBtn.textContent = 'Delete';
      deleteBtn.className = 'delete-btn';

      deleteBtn.addEventListener('click', function() {
        todoList.removeChild(li);
      });

      
      li.appendChild(textSpan);
      li.appendChild(deleteBtn);
      todoList.appendChild(li);

     
      todoInput.value = '';
    }

    
    addTodoBtn.addEventListener('click', addTask);

    
    todoInput.addEventListener('keypress', function(event) {
      if (event.key === 'Enter') {
        addTask();
      }
    });
  </script>
</body>
</html>
