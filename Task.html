<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basics of Web Development</title>
  
  
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      margin: 0;
      padding: 40px;
      display: flex;
      justify-content: center;
    }

    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      width: 100%;
    }

    h1 {
      color: #2b580c;
      margin-bottom: 10px;
    }

    p {
      line-height: 1.6;
      color: #555;
    }

    img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 15px 0;
    }

    a {
      color: #007bff;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }

    button {
      background-color: #2b580c;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #1e3e08;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- HTML Content -->
    <h1>Welcome to My First Webpage</h1>
    <p>This page demonstrates foundational HTML structure, custom CSS styling, and interactive JavaScript features.This is my First task by apex planet under intership program</p>
    
    <img src="C:\Users\thaka_1skddqn\Downloads\OIP (1).jpg" alt="Sample Web Dev Banner">
    
    <p>Learn more about web development at <a href="https://developer.mozilla.org" target="_blank">MDN Web Docs</a>.</p>
    
    
    <button id="alertBtn">Click Me!</button>
  </div>

 
  <script>
    document.getElementById('alertBtn').addEventListener('click', function() {
      alert('Hello! You successfully triggered a JavaScript alert.');
    });
  </script>

</body>
</html>
